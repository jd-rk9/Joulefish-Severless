apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gammamotion.fullname" . }}
  labels:
    {{- include "gammamotion.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gammamotion.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gammamotion.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gammamotion.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv | quote }}
            - name: LLM_API_PROVIDER
              value: {{ .Values.config.llmApiProvider | quote }}
            - name: LLM_API_URL
              value: {{ .Values.config.llmApiUrl | quote }}
            - name: LLM_MODEL_NAME_OVERRIDE
              value: {{ .Values.config.llmModelNameOverride | quote }}
            {{- if .Values.secrets.geminiApiKey }}
            - name: GEMINI_API_KEY
              value: {{ .Values.secrets.geminiApiKey | quote }}
            {{- end }}
            {{- if .Values.secrets.llmApiKey }}
            - name: LLM_API_KEY
              value: {{ .Values.secrets.llmApiKey | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

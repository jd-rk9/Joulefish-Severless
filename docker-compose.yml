services:
  joulefish:
    build:
      context: .
      dockerfile: Dockerfile
    image: joulefish-console:latest
    container_name: joulefish-console
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY={API-key}
      - LLM_API_PROVIDER=gemini
      - LLM_API_URL=https://hostyourai.com/api/v1/chat/completions
      - LLM_MODEL_NAME_OVERRIDE=gemma-4-26b-a4b-it



